name: release-memory-mcpb

# Builds the @agentic/mcp-server-memory Desktop Extension (.mcpb) once per OS+arch.
#
# WHY a matrix: the bundle ships native node_modules (better-sqlite3, sqlite-vec,
# onnxruntime-node, sharp via @xenova/transformers) whose binaries are HOST-built and
# HOST-only — sqlite-vec and sharp install only the prebuild matching the runner's
# os/arch, so each target MUST be packed on a matching runner. There is no cross-build.
#
# Platform scope: macOS (arm64, x64) + Linux (x64, arm64). Windows is intentionally
# EXCLUDED — ADR-0001 §4.1 (setsid/PGID has no Windows equivalent) and sqlite-vec has
# no win32-arm64 sub-package. The MCPB manifest cannot express CPU arch (OS only), so
# each bundle's arch is encoded in its filename: agentic-memory-<version>-<os>-<arch>.mcpb
# (e.g. agentic-memory-0.3.0-darwin-arm64.mcpb). The pack script self-stamps the bundle
# with the runner's process.platform/process.arch.
#
# Triggers:
#   - workflow_dispatch: produces downloadable artifacts (for install-testing in Claude Desktop)
#   - pull_request touching the memory bundle (paths below): builds the full matrix to validate
#     all platforms BEFORE merge; uploads artifacts only — create-release is skipped (not a
#     memory-v tag) and the Release-upload step is tag-gated, so no Release is cut on a PR
#   - push of a `memory-v*` tag: cuts a GitHub Release with all per-platform bundles attached
#     (separate tag namespace so it never collides with release.yml, which fires on `v*`)

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'packages/mcp-servers/memory/**'
      - 'packages/memory/**'
      - 'packages/core/**'
      - 'packages/memory-dashboard/**'
      - '.github/workflows/release-memory-mcpb.yml'
  push:
    tags:
      - 'memory-v*'

permissions:
  contents: write # create the release and upload assets

concurrency:
  group: release-memory-mcpb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    # Pre-create the Release once so the parallel build matrix does not race to spawn
    # duplicate drafts (lesson: automatised-pipeline v0.0.4). Tag pushes only.
    if: startsWith(github.ref, 'refs/tags/memory-v')
    runs-on: ubuntu-24.04
    steps:
      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build:
    needs: [create-release]
    # create-release is SKIPPED on workflow_dispatch; !cancelled() lets build run anyway
    # (and on a tag, only after create-release succeeds). Unlike always(), a genuine
    # create-release FAILURE aborts the matrix instead of uploading to a missing release.
    # The release-upload step below is independently gated on the tag.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, os: darwin, arch: arm64 }
          - { runner: ubuntu-24.04, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 } # GA standard runner — `ubuntu-latest-arm` does NOT exist
          # darwin-x64 (Intel macOS) intentionally NOT shipped: onnxruntime-node@1.25.1
          # — pinned for FlashRank reranker numerical parity with the Python Cortex —
          # provides no Intel-macOS binary (ONNX Runtime dropped x64 macOS), so the
          # offline reranker/fusion cannot run there. Rather than ship a .mcpb whose
          # offline fusion silently degrades, Intel macOS is unsupported for this
          # extension. source: onnxruntime-node 1.25.1 bin/ ships darwin/arm64 only
          # (no darwin/x64); verified 2026-06-19 against the packed bundle.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40 # in-bundle `npm install` fetches/builds ~400-500 MB of native deps
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # reads packageManager pnpm@10.0.0 from package.json

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          # 20 matches engines >=20 and esbuild --target=node20; better-sqlite3 prebuilds
          # cover Node 20-25, so no node-gyp compilation is triggered on any target.
          node-version: '20'
          cache: pnpm

      - name: Install workspace (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build esbuild deps (@agentic/core, /memory, /memory-dashboard)
        # esbuild resolves the deep @agentic/memory/*.js subpath imports through each
        # package's exports map, which points ONLY to ./dist — so these MUST be compiled
        # before packing. The trailing `...` makes each filter TRANSITIVE (the package
        # plus its workspace dependencies, built in topo order), so we never rely on the
        # three names happening to cover the whole closure — while still skipping the Rust
        # codebase plugin and other unrelated packages (unlike a blunt `pnpm build`).
        run: pnpm --filter "@agentic/core..." --filter "@agentic/memory..." --filter "@agentic/memory-dashboard..." build

      - name: Provision offline models (embedding + reranker)
        # Download the 3 models pack-mcpb bundles into the local caches it reads, so
        # the produced .mcpb is fully OFFLINE. A clean runner has no model cache, so
        # without this pack-mcpb would warn and ship a bundle that downloads from
        # HuggingFace at first use. source: scripts/fetch-models.mjs (URLs verified).
        run: node packages/mcp-servers/memory/scripts/fetch-models.mjs

      - name: Pack .mcpb (esbuild -> npm install natives -> mcpb pack)
        # The script self-stamps the bundle with this runner's os/arch: it sets
        # compatibility.platforms=[process.platform] and names the file
        # agentic-memory-<version>-<os>-<arch>.mcpb. Models are bundled BY DEFAULT
        # (the step above provisioned them) → the bundle is offline-self-contained.
        run: node packages/mcp-servers/memory/scripts/pack-mcpb.mjs --out dist-mcpb

      - name: Locate artifact + checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dir=packages/mcp-servers/memory/dist-mcpb
          shopt -s nullglob
          files=("$dir"/agentic-memory-*-"${{ matrix.os }}"-"${{ matrix.arch }}".mcpb)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "expected exactly 1 bundle for ${{ matrix.os }}-${{ matrix.arch }}, found ${#files[@]}: ${files[*]:-<none>}" >&2
            exit 1
          fi
          f=${files[0]}
          base=$(basename "$f")
          ( cd "$dir" && shasum -a 256 "$base" > "$base.sha256" )
          {
            echo "path=$f"
            echo "name=$base"
            echo "sha=$f.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Runtime smoke-test the packed .mcpb (offline)
        # Boot the bundle and exercise it OFFLINE before publishing. CI previously
        # proved build+pack only — never that the bundle RUNS — and shipped v0.3.0
        # broken (double shebang, `pg` named import, node-fetch dynamic require) with
        # no bundled models. This gate fails the release if the bundle does not boot,
        # is missing tools, or the embedding/reranker models are not offline.
        # source: scripts/smoke-mcpb.mjs
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          unzip -q "${{ steps.artifact.outputs.path }}" -d "$work"
          node packages/mcp-servers/memory/scripts/smoke-mcpb.mjs "$work"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }} # unique per matrix (carries os+arch)
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.sha }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/memory-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.sha }}
