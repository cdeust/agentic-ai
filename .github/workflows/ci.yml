name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test + parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # No `version:` arg — pnpm version is sourced from package.json's
        # `packageManager` field (`pnpm@10.0.0`). Specifying both produces
        # ERR_PNPM_BAD_PM_VERSION on pnpm/action-setup@v4.
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install (lockfile sync assertion — hard gate)
        # HARD GATE (restored 2026-04-27, branch port/ci-restore-hard-gates).
        # --frozen-lockfile serves a dual purpose:
        #   1. Installs dependencies exactly as committed (reproducible builds).
        #   2. Asserts lockfile is in sync with package.json manifests — exits
        #      non-zero if any package.json was updated without regenerating
        #      pnpm-lock.yaml, catching drift immediately.
        # The canonical lockfile was regenerated after the Phase-4 cortex-*
        # merges unified the dependency graph (zod, better-sqlite3, pg, yaml,
        # minimatch, tree-sitter, …). Any future PR that adds/removes deps must
        # run `pnpm install` locally and commit the updated pnpm-lock.yaml.
        # Tracking: docs/PHASE_PLAN.md §Phase-4-to-5-cleanup item (3) resolved.
        run: pnpm install --frozen-lockfile

      - name: Build (sequential)
        # HARD GATE (restored 2026-04-27, audit F-CRIT-001).
        # Items 7–11 from docs/PHASE_PLAN.md §Phase-4-to-5-cleanup were resolved
        # by `port/codebase-analysis-types-cleanup` but ci.yml continued to
        # soft-fail. Verified locally: `pnpm build` exits 0 with all 8 packages
        # green on Node 24.x; CI matrix runs Node 20.x and 22.x.
        # source: docs/audits/FINAL_CROSS_AUDIT.md §F-CRIT-001 (Borges, 2026-04-27).
        run: pnpm build

      - name: Layer-import check (hard gate)
        # source: coding-standards.md §2.2 — Dependency Rule (absolute).
        # `scripts/check-layer-imports.ts` is the canonical Clean Architecture
        # gate (full transitive tracing of barrel re-exports, which the ESLint
        # rule cannot do). Hard-fail any layer violation.
        # source: docs/audits/FINAL_CROSS_AUDIT.md §F-HIGH-002 (Borges, 2026-04-27).
        run: pnpm layer-check

      - name: Source-citation check (hard gate)
        # source: coding-standards.md §8 — every hardcoded number must trace
        # to a paper, benchmark, or measurement. `scripts/check-source-citations.sh`
        # enforces the rule at CI time (the same script also runs as a husky
        # pre-commit hook).
        # source: docs/audits/FINAL_CROSS_AUDIT.md §F-HIGH-002 (Borges, 2026-04-27).
        run: pnpm source-citation-check

      - name: Migration audit (hard gate, pre-cutover)
        # source: docs/MIGRATION_MANIFEST.md §"Validation gate (Phase 6 exit)"
        # and docs/audits/FINAL_CROSS_AUDIT.md §7 (Borges, 2026-04-27).
        # `scripts/audit-migration.sh` mechanically checks the 6 manifest gate
        # rules (manifest coverage, source-citation parity, papers, test
        # count, hook count, port-pending tracking). Required to pass before
        # the 48-hour parity dual-run can be declared complete.
        run: pnpm audit-migration

      - name: Lint (advisory until heap-OOM resolved)
        # ESLint flat config exists at root (eslint.config.js). It uses
        # @typescript-eslint with `projectService: true` for type-aware rules,
        # which currently OOMs the default 4GB Node heap when scanning the
        # monorepo. Bumped to 8GB; if it still OOMs we keep advisory until the
        # config is split per-package or projectService is replaced with
        # cheaper non-type-aware parsing.
        # The CANONICAL layer-import gate is the standalone `pnpm layer-check`
        # step above (full transitive tracing, no type-checker dependency).
        # source: docs/audits/FINAL_CROSS_AUDIT.md §F-HIGH-002 (Borges, 2026-04-27).
        run: NODE_OPTIONS=--max-old-space-size=8192 pnpm lint || echo "::warning::ESLint failed (likely heap-OOM); layer-check above is the authoritative gate"

      - name: Test
        # HARD GATE (restored 2026-04-27, branch port/test-config-cleanup).
        # Items 12–14 from docs/PHASE_PLAN.md §Phase-4-to-5-cleanup resolved:
        #   item 12: root vitest.config.ts ported to vitest v4 defineConfig +
        #            test.projects (defineWorkspace removed in v4).
        #   item 13: packages/core vitest config sets passWithNoTests:true
        #            (no test files yet — placeholder package pending port/core-types).
        #   item 14: wiki/page-classifier.test.ts fixture fixes — imperative title
        #            in ADR fixture and insufficient positive score in convention
        #            fixture corrected to match Python source parity.
        run: pnpm test

      - name: Parity oracle
        # Parity tests run only when the harness exists. The port-parity-baseline
        # branch defines the harness; until it merges, this step is a no-op.
        run: pnpm parity || echo "parity harness not yet wired (port/parity-baseline pending merge)"
        # source: parity tests are mandatory; any divergence between a TS
        # port and its source-language baseline fails CI (post-Phase-5).

      - name: Plugin manifest lint (no shell-fallback expansion)
        # source: ADR-0010. Claude Code's ${CLAUDE_PLUGIN_ROOT} substitution
        # does NOT support compound parameter expansion like ${VAR:-fallback}.
        # We discovered the hard way (2026-04-25) that the fallback form is
        # passed unsubstituted to the spawned binary, which then fails to
        # resolve paths. Forbid the pattern in every plugin manifest.
        #
        # IMPORTANT: manifests live under `plugins/<plugin-name>/.claude-plugin/`
        # (the canonical Claude Code directory layout). The previous version of
        # this step scanned a top-level `.claude-plugin/` directory which has
        # never existed in this repo, so the check was vacuously passing.
        # source: docs/audits/FINAL_CROSS_AUDIT.md §F-HIGH-001 (Borges, 2026-04-27).
        run: |
          set -euo pipefail
          # Scan only actual manifest files (*.json) — markdown docs in
          # plugins/ legitimately QUOTE the forbidden pattern when explaining
          # ADR-0010, so they're excluded by the --include filter.
          # Within the JSON manifests, `_note` keys carry human-readable
          # explanations of the bug being prevented; filter those out so
          # the grep only flags real `command`/`args`/`env` violations.
          # source: ci-pull-request 25044348628 (2026-04-28) — UNIFIED_LAYOUT.md,
          # SURVEY.md, and the three .mcp.json `_note` fields were all false
          # positives explaining the canonical pattern.
          violations=$(grep -rEn --include='*.json' '\$\{[A-Z_]+:-' plugins/ 2>/dev/null | grep -v '"_note":' || true)
          if [[ -n "$violations" ]]; then
            echo "$violations"
            echo "::error::Found shell parameter-expansion fallback pattern in a Claude plugin manifest." >&2
            echo "::error::Claude Code does NOT support \${VAR:-fallback}. Use bare \${CLAUDE_PLUGIN_ROOT}, wrap shell logic in 'bash -c'." >&2
            echo "::error::See docs/ADR/0010-claude-plugin-root-expansion.md for the canonical pattern." >&2
            exit 1
          fi
