name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test + parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # No `version:` arg — pnpm version is sourced from package.json's
        # `packageManager` field (`pnpm@10.0.0`). Specifying both produces
        # ERR_PNPM_BAD_PM_VERSION on pnpm/action-setup@v4.
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install (lockfile sync assertion — hard gate)
        # HARD GATE (restored 2026-04-27, branch port/ci-restore-hard-gates).
        # --frozen-lockfile serves a dual purpose:
        #   1. Installs dependencies exactly as committed (reproducible builds).
        #   2. Asserts lockfile is in sync with package.json manifests — exits
        #      non-zero if any package.json was updated without regenerating
        #      pnpm-lock.yaml, catching drift immediately.
        # The canonical lockfile was regenerated after the Phase-4 cortex-*
        # merges unified the dependency graph (zod, better-sqlite3, pg, yaml,
        # minimatch, tree-sitter, …). Any future PR that adds/removes deps must
        # run `pnpm install` locally and commit the updated pnpm-lock.yaml.
        # Tracking: docs/PHASE_PLAN.md §Phase-4-to-5-cleanup item (3) resolved.
        run: pnpm install --frozen-lockfile

      - name: Build (sequential, advisory)
        # Soft-fail: tracking items 7–11 in docs/PHASE_PLAN.md §Phase-4-to-5-cleanup.
        # Specific errors (all in packages/memory/src/):
        #   item 7:  wiki/handlers/wiki-verify.ts:19 — imports STALE_THRESHOLD
        #            but export was renamed to SYMBOL_STALE_THRESHOLD (item 4 fix
        #            did not update the import at wiki-verify.ts).
        #   item 8:  codebase-analysis/codebase-graph.ts:279 — Map iteration
        #            yields [string, Set<string>]; second element is not string.
        #   item 9:  codebase-analysis/handlers/codebase-analyze-helpers.ts:48,53,54
        #            — readdirSync Dirent<string> vs Dirent<NonSharedBuffer> at
        #            @types/node@25 / TypeScript 5.9 boundary.
        #   item 10: codebase-analysis/index.ts:29 — TS2308 duplicate nodeText
        #            export via barrel export* chains.
        #   item 11: codebase-analysis/scanner.ts:259 — ConversationRecord not
        #            assignable to Record<string,unknown> (missing index signature).
        # This gate is hardened once all five items above are resolved in a
        # follow-up worktree (port/cortex-codebase-analysis-types-cleanup).
        run: pnpm build || echo "::warning::Build failed — see PHASE_PLAN.md §Phase-4-to-5-cleanup items 7-11 for per-file root causes"

      - name: Lint
        # No ESLint config has been wired into the monorepo yet (port/tooling-ci
        # branch holds the design but is not merged). Lint is advisory until
        # tooling-ci merges; treat any failure as warning, not error.
        run: pnpm lint || true

      - name: Test (advisory)
        # Soft-fail: tracking items 12–14 in docs/PHASE_PLAN.md §Phase-4-to-5-cleanup.
        # Specific failures:
        #   item 12: vitest.config.ts root — defineWorkspace removed in vitest v4;
        #            root-level `pnpm test` crashes at config load before any test
        #            file runs (TypeError: defineWorkspace is not a function).
        #   item 13: packages/core — no test files; vitest exits 1 ("No test files
        #            found"). Fix: set passWithNoTests:true in core's vitest config.
        #   item 14: wiki/page-classifier.test.ts — 2 of 742 tests fail
        #            (740 passing); classifyMemory pattern regressions.
        # Actual test signal: 740/742 passing in packages/memory (per local run
        # 2026-04-27). This gate is hardened once items 12–14 are resolved.
        run: pnpm test || echo "::warning::Tests failed — see PHASE_PLAN.md §Phase-4-to-5-cleanup items 12-14 for per-package root causes"

      - name: Parity oracle
        # Parity tests run only when the harness exists. The port-parity-baseline
        # branch defines the harness; until it merges, this step is a no-op.
        run: pnpm parity || echo "parity harness not yet wired (port/parity-baseline pending merge)"
        # source: parity tests are mandatory; any divergence between a TS
        # port and its source-language baseline fails CI (post-Phase-5).

      - name: Plugin manifest lint (no shell-fallback expansion)
        # source: ADR-0010. Claude Code's ${CLAUDE_PLUGIN_ROOT} substitution
        # does NOT support compound parameter expansion like ${VAR:-fallback}.
        # We discovered the hard way (2026-04-25) that the fallback form is
        # passed unsubstituted to the spawned binary, which then fails to
        # resolve paths. Forbid the pattern in every .claude-plugin/ JSON.
        run: |
          set -euo pipefail
          if grep -rEn '\$\{[A-Z_]+:-' .claude-plugin/ 2>/dev/null; then
            echo "::error::Found shell parameter-expansion fallback pattern in a Claude plugin manifest." >&2
            echo "::error::Claude Code does NOT support \${VAR:-fallback}. Use bare \${CLAUDE_PLUGIN_ROOT}, wrap shell logic in 'bash -c'." >&2
            echo "::error::See docs/ADR/0010-claude-plugin-root-expansion.md for the canonical pattern." >&2
            exit 1
          fi
