name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build packages and attach to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Pack tarballs
        # pnpm pack writes <name>-<version>.tgz into the package directory.
        # We rename each to a flat name and move them to dist-tarballs/.
        run: |
          set -euo pipefail
          mkdir -p dist-tarballs
          PACKAGES=(
            packages/core
            packages/memory
            packages/orchestrator
            packages/parity-runner
            packages/mcp-servers/memory
            packages/mcp-servers/codebase
            packages/mcp-servers/reasoning
            packages/mcp-servers/prd
          )
          for pkg in "${PACKAGES[@]}"; do
            name=$(node -e "console.log(require('./$pkg/package.json').name.replace('@','').replace('/','__'))")
            version=$(node -e "console.log(require('./$pkg/package.json').version)")
            (cd "$pkg" && pnpm pack)
            tarball=$(ls "$pkg"/*.tgz | tail -1)
            mv "$tarball" "dist-tarballs/${name}-${version}.tgz"
            echo "Packed: dist-tarballs/${name}-${version}.tgz"
          done

      - name: Create GitHub Release and upload tarballs
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-tarballs/*.tgz
