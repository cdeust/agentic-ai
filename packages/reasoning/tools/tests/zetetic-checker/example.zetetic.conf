# .zetetic.conf — project-local configuration for zetetic-checker.sh
# Place at repo root or .claude/zetetic.conf to take effect.
#
# This file can override file/path exclusions and the profile.
# It CANNOT disable built-in rules (UNSOURCED, MAGIC_NUMBER, TODO_NO_REF) —
# the checker will refuse to load a config that tries.

# Profile: strict | standard | permissive
#   strict     — all findings block (errors); maximum rigor
#   standard   — UNSOURCED blocks, MAGIC_NUMBER/TODO_NO_REF warn (default)
#   permissive — all findings informational, never block (useful in transition)
ZETETIC_PROFILE=standard

# Override the default data/config file exclusion.
# If your project uses JSON/YAML/TOML to carry tuning constants, set this to true
# so those files are scanned. Default: false (skip data formats).
# ZETETIC_CHECK_DATA_FORMATS=true
