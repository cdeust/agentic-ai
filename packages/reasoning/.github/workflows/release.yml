name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Run tests and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep python3

      - name: Run full test suite
        run: bash tests/run-all.sh

      - name: Run zetetic-checker on the source tree
        run: |
          # Strict profile must pass on a release tag (no MAGIC_NUMBER /
          # UNSOURCED / TODO_NO_REF in the codebase itself).
          ZETETIC_PROFILE=strict bash tools/zetetic-checker.sh --tree || true
          # Note: tree mode doesn't fail the build; --staged mode is the
          # commit-time gate. Tag-time check is informational.

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              if (index($0, "[" ver "]")) { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry found for $VERSION; using tag message" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
